name: Deploy Python App to GCP VM via SSH

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Deploy via SSH directly on VM
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VM_IP }}
        username: ${{ secrets.VM_USERNAME }}
        key: ${{ secrets.VM_SSH_KEY }}
        script: |
          # 1. Clone repository if it doesn't exist, otherwise pull latest changes
          if [ ! -d "Sample-2-cicd-py" ]; then
            git clone https://github.com/arpitsingh2703/Sample-2-cicd-py.git
            cd Sample-2-cicd-py
          else
            cd Sample-2-cicd-py
            git pull origin main
          fi

          # 2. Build Docker container image locally on the VM
          sudo docker build -t python-app:latest .

          # 3. Stop and replace running container
          sudo docker stop app-container || true
          sudo docker rm app-container || true
          
          sudo docker run -d \
            --name app-container \
            --restart always \
            -p 80:8000 \
            python-app:latest
